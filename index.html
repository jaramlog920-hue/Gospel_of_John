<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2e222f" />
    <title>일곱 표적: 와서 보라</title>
    <meta name="description" content="요한복음 개역한글 본문을 그대로 담은 도트 어드벤처" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #2e222f;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }
      #game {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #pad {
        display: none;
      }

      /* 세로 화면: 게임이 위쪽 2/3, 패드가 아래 1/3 (휴대용 게임기 느낌) */
      @media (orientation: portrait) {
        #game {
          flex: none;
          height: calc(66dvh - env(safe-area-inset-top));
          margin-top: env(safe-area-inset-top);
        }
        #pad {
          flex: 1;
          min-height: 0;
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 16px;
          padding: 8px max(24px, 7vw) calc(16px + env(safe-area-inset-bottom));
          background: #3e3546;
          border-top: 4px solid #2e222f;
          box-shadow: inset 0 4px 0 #484a77;
          position: relative;
        }
      }
      .pad-dpad {
        position: relative;
        height: min(92%, 44vw, 170px);
        aspect-ratio: 1;
        touch-action: none;
      }
      .pad-dpad svg {
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
        shape-rendering: crispEdges;
      }
      .pad-dpad .arrow {
        fill: #9babb2;
        transition: fill 60ms;
      }
      .pad-dpad[data-dirs~='ArrowUp'] .up,
      .pad-dpad[data-dirs~='ArrowDown'] .down,
      .pad-dpad[data-dirs~='ArrowLeft'] .left,
      .pad-dpad[data-dirs~='ArrowRight'] .right {
        fill: #f9c22b;
      }
      /* 확인 버튼: 방향 패드 폭의 약 절반, 오른손 엄지 자리 */
      .pad-a {
        width: min(22vw, 88px);
        aspect-ratio: 1;
        margin-top: 24px;
        border-radius: 50%;
        border: 3px solid #2e222f;
        padding: 0;
        background: #e83b3b;
        color: #ffffff;
        font: 700 16px/1 system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        letter-spacing: 1px;
        box-shadow:
          inset -4px -4px 0 #b33831,
          inset 4px 4px 0 #f68181,
          0 5px 0 #2e222f;
        touch-action: none;
        cursor: pointer;
      }
      .pad-a.down {
        transform: translateY(4px);
        box-shadow:
          inset -4px -4px 0 #b33831,
          inset 4px 4px 0 #f68181,
          0 1px 0 #2e222f;
        background: #f04f78;
      }
      /* 메뉴 버튼: 오른쪽 위 구석. 자주 누르지 않으므로 작게, 누르는 높이는 44px */
      .pad-menu {
        position: absolute;
        top: 10px;
        right: max(20px, 6vw);
        min-width: 64px;
        height: 44px;
        padding: 0 14px;
        border: 3px solid #2e222f;
        border-radius: 22px;
        background: #484a77;
        color: #c7dcd0;
        font: 700 13px/1 system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        box-shadow: inset 0 3px 0 #4d65b4, 0 3px 0 #2e222f;
        touch-action: none;
        cursor: pointer;
      }
      .pad-menu:active {
        transform: translateY(2px);
        box-shadow: inset 0 3px 0 #4d65b4, 0 1px 0 #2e222f;
      }
      /* 가로 화면: 패드가 없으므로 오른쪽 위 모서리(대개 화면 옆 여백)에 메뉴 버튼 */
      #menu-btn {
        position: fixed;
        top: max(8px, env(safe-area-inset-top));
        right: max(8px, env(safe-area-inset-right));
        width: 44px;
        height: 44px;
        border: 3px solid #2e222f;
        border-radius: 10px;
        background: #484a77;
        color: #c7dcd0;
        font: 700 20px/1 system-ui, sans-serif;
        opacity: 0.85;
        cursor: pointer;
      }
      @media (orientation: portrait) {
        #menu-btn {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="pad"></div>
    <button id="menu-btn" aria-label="메뉴">≡</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
