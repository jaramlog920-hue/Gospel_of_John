<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3d3656" />
    <title>일곱 표적: 와서 보라</title>
    <meta name="description" content="요한복음 개역한글 본문을 그대로 담은 도트 어드벤처" />
    <style>
      @font-face {
        font-family: 'Galmuri11';
        src: url('/assets/fonts/Galmuri11.woff2') format('woff2');
        font-display: block;
      }
      @font-face {
        font-family: 'Galmuri9';
        src: url('/assets/fonts/Galmuri9.woff2') format('woff2');
        font-display: block;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #3d3656;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }
      #game {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #pad {
        display: none;
      }

      /* 세로 화면: 게임이 위쪽 2/3, 패드가 아래 1/3 */
      @media (orientation: portrait) {
        #game {
          flex: none;
          height: calc(66dvh - env(safe-area-inset-top));
          margin-top: env(safe-area-inset-top);
        }
        #pad {
          flex: 1;
          min-height: 0;
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 16px;
          padding: 8px max(24px, 7vw) calc(22px + env(safe-area-inset-bottom));
          background: linear-gradient(#e6e1f2, #d6d0ea);
          border-top: 3px solid #c3bbdb;
          position: relative;
          font-family: 'Galmuri9', sans-serif;
        }
      }
      .pad-dpad {
        position: relative;
        height: min(80%, 44vw, 170px);
        aspect-ratio: 1;
        touch-action: none;
      }
      .pad-dpad svg {
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
      }
      .pad-dpad .arrow {
        fill: #fffaf3;
        opacity: 0.9;
        transition: fill 60ms;
      }
      .pad-dpad[data-dirs~='ArrowUp'] .up,
      .pad-dpad[data-dirs~='ArrowDown'] .down,
      .pad-dpad[data-dirs~='ArrowLeft'] .left,
      .pad-dpad[data-dirs~='ArrowRight'] .right {
        fill: #ffd88a;
        opacity: 1;
      }
      .pad-a {
        height: min(52%, 26vw, 100px);
        aspect-ratio: 1;
        border-radius: 50%;
        border: 0;
        padding: 0;
        background: #f6a6a6;
        color: #fffaf3;
        font-family: 'Galmuri11', sans-serif;
        font-size: 16px;
        box-shadow: 0 5px 0 #d98695;
        touch-action: none;
        cursor: pointer;
      }
      .pad-a.down {
        transform: translateY(4px);
        box-shadow: 0 1px 0 #d98695;
        background: #ffba8c;
      }
      .pad-hint {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(4px + env(safe-area-inset-bottom));
        text-align: center;
        color: #8583b8;
        font-size: 12px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="pad"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
