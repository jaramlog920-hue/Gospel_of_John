<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2e222f" />
    <title>일곱 표적: 와서 보라</title>
    <meta name="description" content="요한복음 개역한글 본문을 그대로 담은 도트 어드벤처" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #2e222f;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }
      #game {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #pad {
        display: none;
      }

      /* 세로 화면: 게임이 위쪽 2/3, 패드가 아래 1/3 (휴대용 게임기 느낌) */
      @media (orientation: portrait) {
        #game {
          flex: none;
          height: calc(66dvh - env(safe-area-inset-top));
          margin-top: env(safe-area-inset-top);
        }
        #pad {
          flex: 1;
          min-height: 0;
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 16px;
          padding: 8px max(24px, 7vw) calc(16px + env(safe-area-inset-bottom));
          background: #3e3546;
          border-top: 4px solid #2e222f;
          box-shadow: inset 0 4px 0 #484a77;
          position: relative;
        }
      }
      .pad-dpad {
        position: relative;
        height: min(78%, 44vw, 170px);
        aspect-ratio: 1;
        touch-action: none;
      }
      .pad-dpad svg {
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
        shape-rendering: crispEdges;
      }
      .pad-dpad .arrow {
        fill: #9babb2;
        transition: fill 60ms;
      }
      .pad-dpad[data-dirs~='ArrowUp'] .up,
      .pad-dpad[data-dirs~='ArrowDown'] .down,
      .pad-dpad[data-dirs~='ArrowLeft'] .left,
      .pad-dpad[data-dirs~='ArrowRight'] .right {
        fill: #f9c22b;
      }
      .pad-a {
        height: min(50%, 26vw, 100px);
        aspect-ratio: 1;
        border-radius: 50%;
        border: 3px solid #2e222f;
        padding: 0;
        background: #e83b3b;
        color: #ffffff;
        font: 700 17px/1 system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        letter-spacing: 1px;
        box-shadow:
          inset -4px -4px 0 #b33831,
          inset 4px 4px 0 #f68181,
          0 5px 0 #2e222f;
        touch-action: none;
        cursor: pointer;
      }
      .pad-a.down {
        transform: translateY(4px);
        box-shadow:
          inset -4px -4px 0 #b33831,
          inset 4px 4px 0 #f68181,
          0 1px 0 #2e222f;
        background: #f04f78;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="pad"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
